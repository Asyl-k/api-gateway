server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    circuitbreaker:
      resilience4j:
        enabled: true
services:
  orders-url: ${ORDERS_SERVICE_URL:http://localhost:8081}
  inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  booking-url: ${BOOKING_SERVICE_URL:http://localhost:8083}
resilience4j:
  circuitbreaker:
    instances:
      orders:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      inventory:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      bookings:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
